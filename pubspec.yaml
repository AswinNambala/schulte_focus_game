name: schulte_focus
description: "Schulte Focus - Schulte table game for focus and peripheral vision training."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency Injection & Functional Programming
  get_it: ^8.0.3
  fpdart: ^1.1.0

  # Navigation
  go_router: ^14.6.3

  # Firebase Ecosystem
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.5.1
  firebase_crashlytics: ^4.2.0
  firebase_analytics: ^11.3.5

  # Analytics & Charts
  fl_chart: ^0.69.2

  # Local Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI, Icons, Animations & Utilities
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0
  uuid: ^4.5.1
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/schulte_table_logo.png

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/schulte_table_logo.png"
  min_sdk_android: 24
  adaptive_icon_background: "#FAF2F2"
  adaptive_icon_foreground: "assets/schulte_table_logo.png"
